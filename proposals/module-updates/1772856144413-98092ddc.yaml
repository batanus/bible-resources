old_text: "И возгорелся<S>2734</S> гнев<S>639</S> Господен<S>3068</S> на Моисея,<S>4872</S> и Он сказал:<S>559</S><pb/>«Разве нет у тебя брата<S>251</S> Аарона,<S>175</S> левита?<S>3881</S> Я знаю,<S>3045</S> что он может<S>1696</S>говорить<S>1696</S> <i>вместо тебя</i>, и вот, он выйдет<S>3318</S> навстречу<S>7125</S> тебе, и, увидев<S>7200</S> тебя, возрадуется<S>8055</S> в сердце<S>3820</S> своем."
