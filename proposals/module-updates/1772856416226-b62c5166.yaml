old_text: "И пошел<S>3212</S> Моисей,<S>4872</S> и возвратился<S>7725</S> к Иофору,<S>3500</S> тестю<S>2859</S> своему, и сказал<S>559</S> ему: <pb/>«Пойду<S>3212</S> я, и возвращусь<S>7725</S> к братьям<S>251</S> моим, которые в Египте,<S>4714</S> и посмотрю,<S>7200</S> живы<S>2416</S> ли еще<S>5750</S> они?»<pb/> И<S>559</S> Иофор<S>3503</S> Иофор Моисею:<S>4872</S> <pb/>«Иди<S>3212</S> с миром».<S>7965</S> <pb/> <i>Спустя много времени умер царь египетский</i>."
